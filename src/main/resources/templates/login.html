<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Patient Login - Doctor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="shortcut icon" href="logo/logo10.png" type="image/x-icon"/>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .auth-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #1e3c72, #2a5298, #1e3c72, #3a5ca8);
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
        }

        .auth-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: float 8s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
            }
            50% {
                transform: translateY(-20px) translateX(20px);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(30, 60, 114, 0.3);
            max-width: 480px;
            width: 100%;
            padding: 48px;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s ease-out;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .auth-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(30, 60, 114, 0.4);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header h1 {
            font-size: 32px;
            color: #2c5aa0;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .auth-header p {
            color: #666;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 24px;
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
        }

        .form-group:nth-child(1) {
            animation-delay: 0.1s;
        }

        .form-group:nth-child(2) {
            animation-delay: 0.2s;
        }

        .form-group:nth-child(3) {
            animation-delay: 0.3s;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2c5aa0;
            box-shadow: 0 0 0 3px rgba(44, 90, 160, 0.1);
        }

        .form-group input.error {
            border-color: #ff4444;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            10%, 30%, 50%, 70%, 90% {
                transform: translateX(-5px);
            }
            20%, 40%, 60%, 80% {
                transform: translateX(5px);
            }
        }

        .error-message {
            color: #ff4444;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: fadeInUp 0.3s ease-out;
        }

        .g-recaptcha {
            margin-bottom: 16px;
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            animation-delay: 0.4s;
        }

        #captchaerror {
            display: block;
            color: #ff4444;
            font-size: 13px;
            margin-top: 6px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2c5aa0, #1e4178);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            animation-delay: 0.5s;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(44, 90, 160, 0.4);
            background: linear-gradient(135deg, #1e4178, #2c5aa0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: #666;
            font-size: 14px;
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            animation-delay: 0.6s;
        }

        .auth-footer a {
            color: #2c5aa0;
            text-decoration: none;
            font-weight: 600;
            position: relative;
        }

        .auth-footer a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background: linear-gradient(90deg, #2c5aa0, #4a90e2);
            transition: width 0.3s ease;
        }

        .auth-footer a:hover::after {
            width: 100%;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            animation: fadeInUp 0.3s ease-out;
        }

        .alert.show {
            display: block;
        }

        .alert.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef5350;
        }

        .alert.success {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-logo img {
            height: 50px;
            animation: fadeInUp 0.8s ease-out;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 4px;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: #2c5aa0;
        }
    </style>
</head>
<body>
<div class="auth-section">
    <div class="auth-container">
        <div class="auth-logo">
            <img src="logo/logo10.png" alt="Doctor Logo"/>
        </div>

        <div class="auth-header">
            <h1>Welcome Back</h1>
            <p>Login to access your account</p>
        </div>

        <div class="alert" id="alertMessage"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="mobileNumber">Mobile Number *</label>
                <input
                        type="tel"
                        id="mobileNumber"
                        name="mobileNumber"
                        placeholder="Enter your mobile number"
                        required
                />
                <div class="error-message" id="mobileError">Please enter a valid mobile number</div>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <div class="password-wrapper">
                    <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                    />
                </div>
                <div class="error-message" id="passwordError">Please enter your password</div>
            </div>

            <div class="g-recaptcha" data-sitekey="6Ld1hO0rAAAAAL0G-5DxFVg9-RARY7gHGlljkTZK"></div>
            <span id="captchaerror"></span>

            <button type="submit" class="submit-btn" id="submitBtn">
                Login
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register">Register here</a>
        </div>
    </div>
</div>

<script>
    function handleLogin(event) {
        event.preventDefault();

        // Clear previous errors
        document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
        document.querySelectorAll('input').forEach(el => el.classList.remove('error'));
        document.getElementById('alertMessage').classList.remove('show');

        // Get form values
        const mobileNumber = document.getElementById('mobileNumber').value.trim();
        const password = document.getElementById('password').value;

        let isValid = true;

        // Validate mobile number
        const mobileRegex = /^[6-9]\d{9}$/;
        if (!mobileRegex.test(mobileNumber)) {
            showError('mobileNumber', 'mobileError');
            isValid = false;
        }

        // Validate password
        if (password.length < 1) {
            showError('password', 'passwordError');
            isValid = false;
        }

        if (!isValid) return;

        var response = grecaptcha.getResponse();
        if (response.length === 0) {
            document.getElementById("captchaerror").textContent = "Please verify that you are not a robot";
            return;
        } else {
            document.getElementById("captchaerror").textContent = "";
        }

        // Disable submit button
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Logging in...';

        // Prepare login data
        const loginData = {
            mobileNumber: mobileNumber,
            password: password
        };

        console.log(mobileNumber);
        console.log(password);

        // Go for Doctor Dashboard
        if(mobileNumber=="6385803051" && password=="doctor@2025") {
            sessionStorage.setItem("doctorLoggedIn","true");
            sessionStorage.setItem("doctorNum",mobileNumber);
            sessionStorage.setItem("doctorName","Dr. Sakthi");
            Swal.fire({
                title: "Welcome Dr.P.R.Durai",
                icon: "success",
                draggable: true,
                confirmButtonColor: "#2c5aa0",
                showConfirmButton: true,
                confirmButtonText: "OK"
            }).then((result) => {
                window.location.href = '/DoctorDashboard';
            });
            return;
        } else {
            sessionStorage.setItem("patientNum",mobileNumber);
            console.log("Session OK");
        }

        // Send to backend - FIXED: Use relative URL instead of hardcoded localhost
        fetch('/api/patients/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(loginData)
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => {
                    throw new Error(err.message || 'Login failed');
                });
            }
            return response.json();
        })
        .then(data => {
            // Store patient info in sessionStorage
            sessionStorage.setItem('patientId', data.id);
            sessionStorage.setItem('patientName', data.patientName);
            sessionStorage.setItem('mobileNumber', data.mobileNumber);

            // Show success message
            showAlert('Login successful! Redirecting...', 'success');

            // Redirect to home page after 1 second
            setTimeout(() => {
                window.location.href = 'dashboard';
            }, 1000);
        })
        .catch(error => {
            showAlert(error.message, 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Login';
        });
    }

    function showError(inputId, errorId) {
        document.getElementById(inputId).classList.add('error');
        document.getElementById(errorId).classList.add('show');
    }

    function showAlert(message, type) {
        const alertEl = document.getElementById('alertMessage');
        alertEl.textContent = message;
        alertEl.className = 'alert show ' + type;
    }
</script>
</body>

</html>
