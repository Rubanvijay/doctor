<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="shortcut icon" href="logo/logo3.png" type="image/x-icon"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking History</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        h1 {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .table-wrapper {
            overflow-x: auto;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.9em;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        tbody tr {
            transition: all 0.3s ease;
        }

        tbody tr:hover {
            background: #e8f0fa;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .btn-delete {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 38, 38, 0.4);
        }

        .btn-delete:active {
            transform: translateY(0);
        }

        .btn-delete:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .empty-message {
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 1.2em;
        }

        .alert {
            padding: 15px;
            margin: 20px;
            border-radius: 5px;
            display: none;
        }

        .alert.success {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }

        .alert.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(0.95);
            }
        }

        /* Navigation Back Button */
        .nav-back {
            margin: 20px 0;
            text-align: left;
        }

        .btn-back {
            background: linear-gradient(135deg, #2c5aa0, #1e4178);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(44, 90, 160, 0.4);
            background: linear-gradient(135deg, #1e4178, #2c5aa0);
        }

        /* Enhanced styling for better visual appeal */
        .table-wrapper {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Status badge styling */
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
            display: inline-block;
        }

        .status-active {
            background: #dbeafe;
            color: #1e40af;
        }

        /* Responsive table scroll indicator */
        .table-wrapper::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 30px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.8));
            pointer-events: none;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
                padding: 20px;
            }

            th, td {
                padding: 10px;
                font-size: 0.85em;
            }

            .btn-delete {
                padding: 6px 12px;
                font-size: 0.8em;
            }

            .btn-back {
                padding: 8px 16px;
                font-size: 0.9em;
            }

            /* Make table scrollable on mobile */
            .table-wrapper {
                overflow-x: scroll;
            }

            table {
                min-width: 800px;
            }
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% {
                content: '.';
            }
            40% {
                content: '..';
            }
            60%, 100% {
                content: '...';
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Navigation Back Button -->
    <div class="nav-back">
        <a href="/dashboard" class="btn-back">
            ← Back to Dashboard
        </a>
    </div>

    <h1>📋 Booking History</h1>

    <div id="alertBox" class="alert"></div>

    <div class="table-wrapper">
        <table th:if="${history != null && !history.isEmpty()}">
            <thead>
            <tr>
                <th>Patient Name</th>
                <th>Phone Number</th>
                <th>Branch</th>
                <th>Address</th>
                <th>Appointment Date</th>
                <th>Appointment Time</th>
                <th>Message</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="booking : ${history}">
                <td th:text="${booking.patientName}"></td>
                <td th:text="${booking.phoneNumber}"></td>
                <td th:text="${booking.branch}"></td>
                <td th:text="${booking.address}"></td>
                <td th:text="${booking.appointmentDate}"></td>
                <td th:text="${booking.appointmentTime}"></td>
                <td th:text="${booking.message}"></td>
                <td>
                    <button class="btn-delete"
                            th:attr="data-id=${booking.id}"
                            onclick="deleteBooking(this)">
                        Cancel
                    </button>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${history == null || history.isEmpty()}" class="empty-message">
            <p>📭 No bookings found</p>
        </div>
    </div>
</div>

<script>
    function deleteBooking(button) {
        const bookingId = button.getAttribute('data-id');

        if (!confirm('Are you sure you want to cancel this booking?')) {
            return;
        }

        // Disable button during request
        button.disabled = true;
        button.textContent = 'Canceling...';

        fetch(`/api/patients/bookings/${bookingId}`, {
            method: 'DELETE',
            credentials: 'include',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => {
                    throw new Error(err.message || 'Failed to cancel booking');
                });
            }
            return response.json();
        })
        .then(data => {
            showAlert('Booking canceled successfully!', 'success');

            // Remove the row from the table
            const row = button.closest('tr');
            row.style.animation = 'fadeOut 0.3s ease';
            setTimeout(() => {
                row.remove();

                // Check if table is now empty
                const tbody = document.querySelector('tbody');
                if (tbody && tbody.children.length === 0) {
                    location.reload(); // Reload to show empty message
                }
            }, 300);
        })
        .catch(error => {
            console.error('Error:', error);
            showAlert(error.message || 'Failed to cancel booking', 'error');
            button.disabled = false;
            button.textContent = 'Cancel';
        });
    }

    function showAlert(message, type) {
        const alertBox = document.getElementById('alertBox');
        alertBox.textContent = message;
        alertBox.className = `alert ${type} show`;

        setTimeout(() => {
            alertBox.classList.remove('show');
        }, 3000);
    }

    // Page load animation
    document.addEventListener('DOMContentLoaded', function() {
        const tableWrapper = document.querySelector('.table-wrapper');
        if (tableWrapper) {
            tableWrapper.style.animation = 'fadeIn 0.5s ease';
        }
    });
</script>
</body>
</html>
