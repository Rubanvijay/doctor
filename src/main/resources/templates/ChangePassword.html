<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Change Password - Doctor Appointment</title>
    <meta name="description" content="Change your password securely"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="logo/logo3.png" type="image/x-icon"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Animation Keyframes */
        @keyframes fadeInUp {
          from {
            opacity: 0;
            transform: translateY(30px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        @keyframes pulse {
          0% {
            transform: scale(1);
          }
          50% {
            transform: scale(1.05);
          }
          100% {
            transform: scale(1);
          }
        }

        @keyframes gradientShift {
          0% {
            background-position: 0% 50%;
          }
          50% {
            background-position: 100% 50%;
          }
          100% {
            background-position: 0% 50%;
          }
        }

        @keyframes ripple {
          0% {
            transform: scale(0, 0);
            opacity: 0.5;
          }
          100% {
            transform: scale(20, 20);
            opacity: 0;
          }
        }

        @keyframes shake {
          0%, 100% {
            transform: translateX(0);
          }
          10%, 30%, 50%, 70%, 90% {
            transform: translateX(-5px);
          }
          20%, 40%, 60%, 80% {
            transform: translateX(5px);
          }
        }

        @keyframes rotate {
          from {
            transform: rotate(0deg);
          }
          to {
            transform: rotate(360deg);
          }
        }

        /* Animation Classes */
        .animate-fadeInUp {
          animation: fadeInUp 0.8s ease-out forwards;
          opacity: 0;
        }

        .animate-pulse {
          animation: pulse 2s infinite;
        }

        .animate-shake {
          animation: shake 0.5s ease-in-out;
        }

        /* Page Loader */
        .page-loader {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: white;
          display: flex;
          justify-content: center;
          align-items: center;
          z-index: 9999;
          transition: opacity 0.5s, visibility 0.5s;
        }

        .page-loader.hidden {
          opacity: 0;
          visibility: hidden;
        }

        .loader {
          width: 50px;
          height: 50px;
          border: 5px solid #f3f3f3;
          border-top: 5px solid #2c5aa0; /* Updated to login blue */
          border-radius: 50%;
          animation: rotate 1s linear infinite;
        }

        /* Change Password Page Styles - UPDATED WITH LOGIN BLUE COLORS */
        .change-password-section {
          min-height: 80vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 2rem 0;
          background: linear-gradient(-45deg, #1e3c72, #2a5298, #1e3c72, #3a5ca8); /* Exact login background */
          background-size: 400% 400%;
          animation: gradientShift 10s ease infinite;
        }

        .change-password-container {
          max-width: 500px;
          width: 100%;
          background: white;
          border-radius: 16px;
          box-shadow: 0 20px 60px rgba(30, 60, 114, 0.3); /* Updated shadow color */
          padding: 3rem;
          position: relative;
          overflow: hidden;
        }

        .change-password-container::before {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 6px;
          background: linear-gradient(90deg, #2c5aa0, #1e4178); /* Exact login button gradient */
        }

        .change-password-header {
          text-align: center;
          margin-bottom: 2rem;
        }

        .change-password-header h1 {
          font-size: 2rem;
          color: #2c5aa0; /* Updated to login blue */
          margin: 0 0 0.5rem 0;
        }

        .change-password-header p {
          color: #666; /* Same as login page */
          margin: 0;
        }

        .password-form {
          display: flex;
          flex-direction: column;
          gap: 1.5rem;
        }

        .form-group {
          position: relative;
        }

        .form-label {
          display: block;
          margin-bottom: 0.5rem;
          color: #2c5aa0; /* Updated to login blue */
          font-weight: 600;
        }

        .form-input {
          width: 100%;
          padding: 1rem;
          border: 2px solid #e0e0e0; /* Same as login page */
          border-radius: 8px;
          font-size: 1rem;
          transition: all 0.3s ease;
          background: #f9fafb;
        }

        .form-input:focus {
          outline: none;
          border-color: #2c5aa0; /* Updated to login blue */
          background: white;
          box-shadow: 0 0 0 3px rgba(44, 90, 160, 0.1); /* Updated to login blue */
        }

        .form-input.error {
          border-color: #ff4444;
          animation: shake 0.5s ease-in-out;
        }

        .password-toggle {
          position: absolute;
          right: 1rem;
          top: 50%;
          transform: translateY(-50%);
          background: none;
          border: none;
          color: #666; /* Same as login page */
          cursor: pointer;
          transition: color 0.3s ease;
        }

        .password-toggle:hover {
          color: #2c5aa0; /* Updated to login blue */
        }

        .password-strength {
          margin-top: 0.5rem;
          height: 4px;
          border-radius: 2px;
          background: #e5e7eb;
          overflow: hidden;
        }

        .password-strength-bar {
          height: 100%;
          width: 0;
          transition: width 0.3s ease, background-color 0.3s ease;
        }

        .password-strength.weak .password-strength-bar {
          width: 33%;
          background-color: #ef4444;
        }

        .password-strength.medium .password-strength-bar {
          width: 66%;
          background-color: #f59e0b;
        }

        .password-strength.strong .password-strength-bar {
          width: 100%;
          background-color: #10b981;
        }

        /* SUBMIT BUTTON - UPDATED WITH EXACT LOGIN BLUE COLORS */
        .submit-button {
          background: linear-gradient(135deg, #2c5aa0, #1e4178); /* Exact login button gradient */
          color: white;
          border: none;
          border-radius: 8px;
          padding: 1rem 2rem;
          font-size: 1rem;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.3s ease;
          position: relative;
          overflow: hidden;
        }

        .submit-button:hover {
          transform: translateY(-2px);
          box-shadow: 0 8px 20px rgba(44, 90, 160, 0.4); /* Updated to login blue */
          background: linear-gradient(135deg, #1e4178, #2c5aa0); /* Exact login button hover gradient */
        }

        .submit-button:active {
          transform: translateY(0);
        }

        .submit-button:disabled {
          opacity: 0.6;
          cursor: not-allowed;
          transform: none;
          box-shadow: none;
        }

        .submit-button::after {
          content: '';
          position: absolute;
          top: 50%;
          left: 50%;
          width: 5px;
          height: 5px;
          background: rgba(255, 255, 255, 0.5);
          opacity: 0;
          border-radius: 100%;
          transform: scale(1, 1) translate(-50%);
          transform-origin: 50% 50%;
        }

        .submit-button:hover::after {
          animation: ripple 1s ease-out;
        }

        .back-to-dashboard {
          text-align: center;
          margin-top: 2rem;
        }

        .back-link {
          color: #666; /* Same as login page */
          text-decoration: none;
          display: inline-flex;
          align-items: center;
          gap: 0.5rem;
          transition: color 0.3s ease;
        }

        .back-link:hover {
          color: #2c5aa0; /* Updated to login blue */
        }

        .back-link::after {
          content: '';
          position: absolute;
          width: 0;
          height: 2px;
          bottom: -2px;
          left: 0;
          background: linear-gradient(90deg, #2c5aa0, #4a90e2); /* Same as login page */
          transition: width 0.3s ease;
        }

        .back-link:hover::after {
          width: 100%;
        }

        .success-message {
          background: #dbeafe; /* Updated to blue tint */
          color: #1e40af; /* Updated to blue */
          padding: 1rem;
          border-radius: 8px;
          margin-bottom: 1.5rem;
          display: none;
          animation: fadeInUp 0.5s ease-out;
        }

        .error-message {
          background: #fee2e2;
          color: #991b1b;
          padding: 1rem;
          border-radius: 8px;
          margin-bottom: 1.5rem;
          display: none;
          animation: fadeInUp 0.5s ease-out;
        }

        /* Header Styles - UPDATED WITH LOGIN BLUE */
        .header-navigation {
          display: flex;
          list-style: none;
          margin: 0;
          padding: 0;
          gap: 32px;
        }

        .nav-link {
          position: relative;
          transition: color 0.3s ease;
          padding: 8px 0;
          margin-left:75px;
          color: #333; /* Default color */
        }

        .nav-link:hover {
          color: #2c5aa0; /* Updated to login blue */
        }

        .nav-link::after {
          content: '';
          position: absolute;
          width: 0;
          height: 2px;
          bottom: 0;
          left: 0;
          background: linear-gradient(90deg, #2c5aa0, #4a90e2); /* Same as login page */
          transition: width 0.3s ease;
        }

        .nav-link:hover::after {
          width: 100%;
        }

        /* User Profile Dropdown Styles - UPDATED WITH LOGIN BLUE */
        .user-info {
          display: flex;
          align-items: center;
          gap: 1rem;
          position: relative;
          cursor: pointer;
        }

        .user-avatar {
          width: 40px;
          height: 40px;
          border-radius: 50%;
          background: linear-gradient(135deg, #2c5aa0, #1e4178); /* Exact login button gradient */
          display: flex;
          align-items: center;
          justify-content: center;
          color: white;
          font-weight: 600;
          transition: transform 0.3s ease;
          animation: pulse 2s infinite;
        }

        .user-info:hover .user-avatar {
          transform: scale(1.1);
          animation: none;
        }

        .user-name {
          font-weight: 500;
          color: #fff;
          font-size: 16px;
          transition: color 0.3s ease;
        }

        .user-info:hover .user-name {
          color: #fff;
        }

        .user-dropdown {
          position: absolute;
          top: 100%;
          right: 0;
          background: white;
          border-radius: 8px;
          box-shadow: 0 10px 30px rgba(30, 60, 114, 0.15); /* Updated shadow color */
          min-width: 200px;
          padding: 0.5rem 0;
          z-index: 1000;
          opacity: 0;
          visibility: hidden;
          transform: translateY(-10px);
          transition: all 0.3s ease;
        }

        .user-dropdown.active {
          opacity: 1;
          visibility: visible;
          transform: translateY(0);
        }

        .dropdown-item {
          display: flex;
          align-items: center;
          gap: 0.75rem;
          padding: 0.75rem 1rem;
          color: #1e293b;
          text-decoration: none;
          transition: background 0.3s ease;
        }

        .dropdown-item:hover {
          background: #f0f7ff; /* Updated to blue tint */
          color: #2c5aa0; /* Updated to login blue */
        }

        .dropdown-item i {
          width: 20px;
          text-align: center;
          color: #2c5aa0; /* Updated to login blue */
        }

        .dropdown-divider {
          height: 1px;
          background: #e5e7eb;
          margin: 0.5rem 0;
        }

        @media (max-width: 768px) {
          .change-password-container {
            padding: 2rem;
            margin: 1rem;
          }

          .change-password-header h1 {
            font-size: 1.5rem;
          }

          .user-name {
            display: none;
          }
        }
    </style>
</head>
<body>
<div class="page-loader">
    <div class="loader"></div>
</div>

<div class="page-wrapper">
    <!-- Header -->

    <!-- Change Password Section -->
    <section class="change-password-section">
        <div class="change-password-container animate-fadeInUp">
            <div class="change-password-header">
                <h1>Change Password</h1>
                <p>Create a strong and secure password for your account</p>
            </div>

            <div class="success-message" id="successMessage">
                <strong>Success!</strong> Your password has been updated successfully.
            </div>

            <div class="error-message" id="errorMessage">
                <strong>Error!</strong> <span id="errorText">There was a problem updating your password. Please try again.</span>
            </div>

            <form class="password-form" id="passwordForm">
                <div class="form-group">
                    <label class="form-label" for="newPassword">New Password</label>
                    <div style="position: relative;">
                        <input type="password" id="newPassword" class="form-input" placeholder="Enter your new password" required style="padding-right: 3rem;">
                        <button type="button" class="password-toggle" id="toggleNewPassword" style="top: 50%; margin-top: 0;">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength" id="passwordStrength">
                        <div class="password-strength-bar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <div style="position: relative;">
                        <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm your new password" required style="padding-right: 3rem;">
                        <button type="button" class="password-toggle" id="toggleConfirmPassword" style="top: 50%; margin-top: 0;">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-button" id="submitButton">
                    Change Password
                </button>
            </form>

            <div class="back-to-dashboard">
                <a href="/dashboard" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                    Back to Dashboard
                </a>
            </div>
        </div>
    </section>

    <!-- Footer -->
</div>

<script>
    console.log(sessionStorage.getItem("patientNum"));
    document.addEventListener('DOMContentLoaded', function() {
        // Page loader
        window.addEventListener('load', function() {
            const loader = document.querySelector('.page-loader');
            loader.classList.add('hidden');
        });

        // Password toggle functionality
        const toggleNewPassword = document.getElementById('toggleNewPassword');
        const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const passwordStrength = document.getElementById('passwordStrength');
        const passwordForm = document.getElementById('passwordForm');
        const submitButton = document.getElementById('submitButton');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        // User profile dropdown functionality
        const userProfile = document.getElementById('userProfile');
        const userDropdown = document.getElementById('userDropdown');

        if (userProfile) {
            userProfile.addEventListener('click', function(e) {
                e.stopPropagation();
                userDropdown.classList.toggle('active');
            });

            // Close dropdown when clicking outside
            document.addEventListener('click', function() {
                userDropdown.classList.remove('active');
            });
        }

        // Set username
        const patientName = sessionStorage.getItem('patientName') || 'Vijay';
        if (document.getElementById('username')) {
            document.getElementById('username').textContent = patientName;
        }

        // Toggle password visibility
        function togglePasswordVisibility(input, toggleButton) {
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);

            // Update icon
            const icon = toggleButton.querySelector('i');
            if (type === 'text') {
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        toggleNewPassword.addEventListener('click', function() {
            togglePasswordVisibility(newPasswordInput, this);
        });

        toggleConfirmPassword.addEventListener('click', function() {
            togglePasswordVisibility(confirmPasswordInput, this);
        });

        // Password strength indicator
        newPasswordInput.addEventListener('input', function() {
            const password = this.value;
            let strength = 0;

            if (password.length >= 8) strength++;
            if (password.match(/[a-z]+/)) strength++;
            if (password.match(/[A-Z]+/)) strength++;
            if (password.match(/[0-9]+/)) strength++;
            if (password.match(/[!@#$%^&*(),.?":{}|<>]+/)) strength++;

            // Reset classes
            passwordStrength.className = 'password-strength';

            if (password.length > 0) {
                if (strength <= 2) {
                    passwordStrength.classList.add('weak');
                } else if (strength <= 4) {
                    passwordStrength.classList.add('medium');
                } else {
                    passwordStrength.classList.add('strong');
                }
            }
        });

        // Form submission
        passwordForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Hide previous messages
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';

            // Validate passwords match
            if (newPassword !== confirmPassword) {
                confirmPasswordInput.classList.add('error');
                errorText.textContent = 'Passwords do not match. Please try again.';
                errorMessage.style.display = 'block';
                return;
            } else {
                confirmPasswordInput.classList.remove('error');
            }

            // Validate password strength
            if (newPassword.length < 8) {
                newPasswordInput.classList.add('error');
                errorText.textContent = 'Password must be at least 8 characters long.';
                errorMessage.style.display = 'block';
                return;
            } else {
                newPasswordInput.classList.remove('error');
            }

            // Disable button and show loading state
            submitButton.disabled = true;
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating Password...';

            try {
                // Get patient ID from session
                const patientId = sessionStorage.getItem('patientId');
                const phone = sessionStorage.getItem("patientNum");

                if (!patientId || !phone) {
                    throw new Error('User session not found. Please login again.');
                }

                // Prepare request data (without currentPassword)
                const requestData = {
                    patientId: patientId,
                    phone: phone,
                    newPassword: newPassword
                };

                // Send API request to change password
                const response = await fetch('/api/patients/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData),
                    credentials: 'include'
                });

                const result = await response.json();

                if (response.ok) {
                    // Show success message
                    successMessage.style.display = 'block';

                    // Reset form
                    passwordForm.reset();
                    passwordStrength.className = 'password-strength';

                    // Redirect to dashboard after 2 seconds
                    setTimeout(function() {
                        window.location.href = 'dashboard';
                    }, 2000);
                } else {
                    throw new Error(result.message || 'Failed to update password');
                }

            } catch (error) {
                console.error('Password change error:', error);
                errorText.textContent = error.message || 'Failed to update password. Please try again.';
                errorMessage.style.display = 'block';
            } finally {
                // Re-enable button
                submitButton.disabled = false;
                submitButton.innerHTML = 'Change Password';
            }
        });
    });
</script>
</body>
</html>
